<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <style>
    .conn { stroke: #dcdcdc; stroke-width: 1.8; fill: none; }
    .node-circle { stroke: #b0b0b0; stroke-width: 1.3; }
    .num-text { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; text-anchor: middle; dominant-baseline: central; fill: #000000; }
    .highlight-text { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: bold; text-anchor: middle; dominant-baseline: central; fill: #ffff00; stroke: #000000; stroke-width: 1.2px; paint-order: stroke; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Connecting Layer Lines -->
  <polyline class="conn" points="300,115 352,205 248,205 196,295 300,295 404,295 456,385 352,385 248,385 144,385 92,475 196,475 300,475 404,475 508,475" />

  <!-- Layer 1: T1 = 1 -->
  <g transform="translate(300, 115)">
    <circle class="node-circle" r="24" fill="#f6d5d5" />
    <text class="highlight-text">1</text>
  </g>

  <!-- Layer 2: T2 = 3 -->
  <g transform="translate(352, 205)">
    <circle class="node-circle" r="24" fill="#f7d5e5" />
