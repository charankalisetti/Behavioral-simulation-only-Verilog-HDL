<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <style>
    .conn { stroke: #dcdcdc; stroke-width: 1.8; fill: none; }
    .node-circle { stroke: #b0b0b0; stroke-width: 1.3; }
    .num-text { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: bold; text-anchor: middle; dominant-baseline: central; fill: #000000; }
    .highlight-text { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; text-anchor: middle; dominant-baseline: central; fill: #ffff00; stroke: #000000; stroke-width: 1.2px; paint-order: stroke; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Connecting Layer Lines -->
  <polyline class="conn" points="
    110,110 205,110 205,205 110,205
    110,300 205,300 300,300 300,205 300,110
    395,110 395,205 395,300 395,395 300,395 205,395 110,395
    110,490 205,490 300,490 395,490 490,490 490,395 490,300 490,205 490,110
  " />

  <!-- Layer 1: S1 = 1 -->
  <g transform="translate(110, 110)">
    <circle class="node-circle" r="24" fill="#f6d5d5" />
    <text class="highlight-text">1</text>
  </g>

  <!-- Layer 2: S2 = 4 -->
  <g transform="translate(205, 110)">
    <circle class="node-circle" r="24" fill="#f7d5e5" />
    <text class="num-text">2</text>
  </g>
  <g transform="translate(205, 205)">
    <circle class="node-circle" r="24" fill="#f7d5e5" />
    <text class="num-text">3</text>
  </g>
  <g transform="translate(110, 205)">
    <circle class="node-circle" r="24" fill="#f7d5e5" />
    <text class="highlight-text">4</text>
  </g>

  <!-- Layer 3: S3 = 9 -->
  <g transform="translate(110, 300)">
    <circle class="node-circle" r="24" fill="#f3d2f7" />
    <text class="num-text">5</text>
  </g>
  <g transform="translate(205, 300)">
    <circle class="node-circle" r="24" fill="#f3d2f7" />
    <text class="num-text">6</text>
  </g>
  <g transform="translate(300, 300)">
    <circle class="node-circle" r="24" fill="#f3d2f7" />
    <text class="num-text">7</text>
  </g>
  <g transform="translate(300, 205)">
    <circle class="node-circle" r="24" fill="#f3d2f7" />
    <text class="num-text">8</text>
  </g>
  <g transform="translate(300, 110)">
    <circle class="node-circle" r="24" fill="#f3d2f7" />
    <text class="highlight-text">9</text>
  </g>

  <!-- Layer 4: S4 = 16 -->
  <g transform="translate(395, 110)">
    <circle class="node-circle" r="24" fill="#e2d5f8" />
    <text class="num-text">10</text>
  </g>
  <g transform="translate(395, 205)">
    <circle class="node-circle" r="24" fill="#e2d5f8" />
    <text class="num-text">11</text>
  </g>
  <g transform="translate(395, 300)">
    <circle class="node-circle" r="24" fill="#e2d5f8" />
    <text class="num-text">12</text>
  </g>
  <g transform="translate(395, 395)">
    <circle class="node-circle" r="24" fill="#e2d5f8" />
    <text class="num-text">13</text>
  </g>
  <g transform="translate(300, 395)">
    <circle class="node-circle" r="24" fill="#e2d5f8" />
    <text class="num-text">14</text>
  </g>
  <g transform="translate(205, 395)">
    <circle class="node-circle" r="24" fill="#e2d5f8" />
    <text class="num-text">15</text>
  </g>
  <g transform="translate(110, 395)">
    <circle class="node-circle" r="24" fill="#e2d5f8" />
    <text class="highlight-text">16</text>
  </g>

  <!-- Layer 5: S5 = 25 -->
  <g transform="translate(110, 490)">
    <circle class="node-circle" r="24" fill="#d3d7f9" />
    <text class="num-text">17</text>
  </g>
  <g transform="translate(205, 490)">
    <circle class="node-circle" r="24" fill="#d3d7f9" />
    <text class="num-text">18</text>
  </g>
  <g transform="translate(300, 490)">
    <circle class="node-circle" r="24" fill="#d3d7f9" />
    <text class="num-text">19</text>
  </g>
  <g transform="translate(395, 490)">
    <circle class="node-circle" r="24" fill="#d3d7f9" />
    <text class="num-text">20</text>
  </g>
  <g transform="translate(490, 490)">
    <circle class="node-circle" r="24" fill="#d3d7f9" />
    <text class="num-text">21</text>
  </g>
  <g transform="translate(490, 395)">
    <circle class="node-circle" r="24" fill="#d3d7f9" />
    <text class="num-text">22</text>
  </g>
  <g transform="translate(490, 300)">
    <circle class="node-circle" r="24" fill="#d3d7f9" />
    <text class="num-text">23</text>
  </g>
  <g transform="translate(490, 205)">
    <circle class="node-circle" r="24" fill="#d3d7f9" />
    <text class="num-text">24</text>
  </g>
  <g transform="translate(490, 110)">
    <circle class="node-circle" r="24" fill="#d3d7f9" />
    <text class="highlight-text">25</text>
  </g>
</svg>