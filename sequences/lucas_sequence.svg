<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #1a237e; text-anchor: middle; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: bold; fill: #37474f; text-anchor: middle; }
    .seq-box { fill: #f1f8e9; stroke: #558b2f; stroke-width: 1.8; rx: 8; }
    .seq-num { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #1b5e20; text-anchor: middle; dominant-baseline: central; }
    .ptr-label { font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; fill: #d84315; text-anchor: middle; }
    .col-hdr { font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; fill: #0d47a1; text-anchor: middle; }
    .eq-text { font-family: 'Courier New', Courier, monospace; font-size: 24px; font-weight: bold; fill: #212121; text-anchor: middle; dominant-baseline: central; }
    .step-note { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #455a64; text-anchor: start; dominant-baseline: central; }
    .shift-arrow { stroke: #e65100; stroke-width: 2.5; fill: none; }
    .bracket { stroke: #d84315; stroke-width: 2; fill: none; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e65100" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Header -->
  <text x="340" y="36" class="title">Lucas Sequence: Seed Values &amp; Variable Shift</text>
  <text x="340" y="62" class="subtitle">Default Seed Values: a = 2, b = 1  |  Rule: c = a + b</text>

  <!-- Top Sequence Strip (2, 1, 3, 4, 7, 11) -->
  <g transform="translate(135, 85)">
    <rect x="0" y="0" width="56" height="44" class="seq-box" style="fill:#fff3e0; stroke:#e65100;" />
    <text x="28" y="22" class="seq-num" style="fill:#bf360c;">2</text>

    <rect x="70" y="0" width="56" height="44" class="seq-box" style="fill:#fff3e0; stroke:#e65100;" />
    <text x="98" y="22" class="seq-num" style="fill:#bf360c;">1</text>

    <rect x="140" y="0" width="56" height="44" class="seq-box" />
    <text x="168" y="22" class="seq-num">3</text>

    <rect x="210" y="0" width="56" height="44" class="seq-box" />
    <text x="238" y="22" class="seq-num">4</text>

    <rect x="280" y="0" width="56" height="44" class="seq-box" />
    <text x="308" y="22" class="seq-num">7</text>

    <rect x="350" y="0" width="56" height="44" class="seq-box" />
    <text x="378" y="22" class="seq-num">11</text>

    <!-- Initial Window Bracket under 2 and 1 -->
    <polyline points="28,50 28,60 98,60 98,50" class="bracket" />
    <text x="28" y="76" class="ptr-label">a</text>
    <text x="98" y="76" class="ptr-label">b</text>
    <text x="168" y="76" class="ptr-label" style="fill:#2e7d32;">c</text>
  </g>

  <line x1="45" y1="180" x2="635" y2="180" stroke="#cfd8dc" stroke-width="1.5" />

  <!-- Column Headers -->
  <text x="120" y="212" class="col-hdr">a</text>
  <text x="170" y="212" class="col-hdr">+</text>
  <text x="220" y="212" class="col-hdr">b</text>
  <text x="270" y="212" class="col-hdr">=</text>
  <text x="320" y="212" class="col-hdr" style="fill:#2e7d32;">c</text>
  <line x1="90" y1="224" x2="350" y2="224" stroke="#90a4ae" stroke-width="1.5" />

  <!-- Row 1: 2 + 1 = 3 -->
  <text x="120" y="255" class="eq-text">2</text>
  <text x="170" y="255" class="eq-text">+</text>
  <text x="220" y="255" class="eq-text">1</text>
  <text x="270" y="255" class="eq-text">=</text>
  <text x="320" y="255" class="eq-text" style="fill:#2e7d32;">3</text>
  <text x="380" y="255" class="step-note">Step 1: Lucas seed (a=2, b=1) → c=3</text>

  <!-- Diagonal Shift Arrows (Row 1 -> Row 2) -->
  <line x1="210" y1="272" x2="132" y2="328" class="shift-arrow" marker-end="url(#arrowhead)" />
  <line x1="310" y1="272" x2="232" y2="328" class="shift-arrow" marker-end="url(#arrowhead)" />

  <!-- Row 2: 1 + 3 = 4 -->
  <text x="120" y="350" class="eq-text">1</text>
  <text x="170" y="350" class="eq-text">+</text>
  <text x="220" y="350" class="eq-text">3</text>
  <text x="270" y="350" class="eq-text">=</text>
  <text x="320" y="350" class="eq-text" style="fill:#2e7d32;">4</text>
  <text x="380" y="350" class="step-note">Step 2: Shift (a=b, b=c) → c=4</text>

  <!-- Diagonal Shift Arrows (Row 2 -> Row 3) -->
  <line x1="210" y1="367" x2="132" y2="423" class="shift-arrow" marker-end="url(#arrowhead)" />
  <line x1="310" y1="367" x2="232" y2="423" class="shift-arrow" marker-end="url(#arrowhead)" />

  <!-- Row 3: 3 + 4 = 7 -->
  <text x="120" y="445" class="eq-text">3</text>
  <text x="170" y="445" class="eq-text">+</text>
  <text x="220" y="445" class="eq-text">4</text>
  <text x="270" y="445" class="eq-text">=</text>
  <text x="320" y="445" class="eq-text" style="fill:#2e7d32;">7</text>
  <text x="380" y="445" class="step-note">Step 3: Shift (a=b, b=c) → c=7</text>

  <!-- Legend Footer -->
  <rect x="95" y="480" width="490" height="28" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1" />
  <text x="340" y="494" style="font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #e65100; text-anchor: middle; dominant-baseline: central;">
    Orange Diagonal Arrows:  a = b  (old b moves to a)   |   b = c  (old c moves to b)
  </text>
</svg>