<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520">
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #1a237e; text-anchor: middle; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: bold; fill: #37474f; text-anchor: middle; }
    .step-box { fill: #f8f9fa; stroke: #90a4ae; stroke-width: 1.8; rx: 10; }
    .step-box-win { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.5; rx: 10; }
    .cand-badge { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 6; }
    .cand-badge-win { fill: #c8e6c9; stroke: #2e7d32; stroke-width: 1.8; rx: 6; }
    .cand-text { font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; fill: #0d47a1; text-anchor: middle; dominant-baseline: central; }
    .expr-text { font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; fill: #212121; text-anchor: middle; dominant-baseline: central; }
    .rem-fail { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #c62828; text-anchor: middle; }
    .rem-pass { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #2e7d32; text-anchor: middle; }
    .status-fail { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; fill: #d84315; text-anchor: middle; dominant-baseline: central; }
    .status-win { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: bold; fill: #1b5e20; text-anchor: middle; dominant-baseline: central; }
    .flow-arrow { stroke: #e65100; stroke-width: 2.5; fill: none; }
    .step-label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; fill: #e65100; text-anchor: start; dominant-baseline: central; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e65100" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Header -->
  <text x="380" y="36" class="title">LCM Incremental Step Search: Inputs (3, 7)</text>
  <text x="380" y="62" class="subtitle">1. Greatest Number = max(3, 7) = 7   |   2. Stop when (lcm % 3 == 0) &amp;&amp; (lcm % 7 == 0)</text>

  <!-- STEP 1: Candidate = 7 -->
  <g transform="translate(55, 92)">
    <rect x="0" y="0" width="650" height="84" class="step-box" />
    <rect x="18" y="20" width="110" height="44" class="cand-badge" />
    <text x="73" y="42" class="cand-text">lcm = 7</text>

    <text x="235" y="34" class="expr-text">7 % 3 = 1</text>
    <text x="235" y="60" class="rem-fail">Not 0 (False)</text>

    <text x="325" y="34" class="expr-text" style="fill:#1565c0;">&amp;&amp;</text>

    <text x="415" y="34" class="expr-text">7 % 7 = 0</text>
    <text x="415" y="60" class="rem-pass">Zero (True)</text>

    <line x1="495" y1="14" x2="495" y2="70" stroke="#cfd8dc" stroke-width="1.5" />
    <text x="572" y="34" class="status-fail">Condition False</text>
    <text x="572" y="56" class="status-fail" style="font-size:13px;">Next: 7 + 7 = 14</text>
  </g>

  <!-- Arrow Step 1 -> Step 2 -->
  <line x1="128" y1="178" x2="128" y2="216" class="flow-arrow" marker-end="url(#arrowhead)" />
  <text x="140" y="197" class="step-label">+ 7 (Step by greatest number)</text>

  <!-- STEP 2: Candidate = 14 -->
  <g transform="translate(55, 220)">
    <rect x="0" y="0" width="650" height="84" class="step-box" />
    <rect x="18" y="20" width="110" height="44" class="cand-badge" />
    <text x="73" y="42" class="cand-text">lcm = 14</text>

    <text x="235" y="34" class="expr-text">14 % 3 = 2</text>
    <text x="235" y="60" class="rem-fail">Not 0 (False)</text>

    <text x="325" y="34" class="expr-text" style="fill:#1565c0;">&amp;&amp;</text>

    <text x="415" y="34" class="expr-text">14 % 7 = 0</text>
    <text x="415" y="60" class="rem-pass">Zero (True)</text>

    <line x1="495" y1="14" x2="495" y2="70" stroke="#cfd8dc" stroke-width="1.5" />
    <text x="572" y="34" class="status-fail">Condition False</text>
    <text x="572" y="56" class="status-fail" style="font-size:13px;">Next: 14 + 7 = 21</text>
  </g>

  <!-- Arrow Step 2 -> Step 3 -->
  <line x1="128" y1="306" x2="128" y2="344" class="flow-arrow" marker-end="url(#arrowhead)" />
  <text x="140" y="325" class="step-label">+ 7 (Step by greatest number)</text>

  <!-- STEP 3: Candidate = 21 (FOUND) -->
  <g transform="translate(55, 348)">
    <rect x="0" y="0" width="650" height="88" class="step-box-win" />
    <rect x="18" y="22" width="110" height="44" class="cand-badge-win" />
    <text x="73" y="44" class="cand-text" style="fill:#1b5e20;">lcm = 21</text>

    <text x="235" y="35" class="expr-text">21 % 3 = 0</text>
    <text x="235" y="62" class="rem-pass">Zero (True)</text>

    <text x="325" y="35" class="expr-text" style="fill:#2e7d32;">&amp;&amp;</text>

    <text x="415" y="35" class="expr-text">21 % 7 = 0</text>
    <text x="415" y="62" class="rem-pass">Zero (True)</text>

    <line x1="495" y1="14" x2="495" y2="74" stroke="#81c784" stroke-width="1.8" />
    <text x="572" y="34" class="status-win">BOTH ZERO!</text>
    <text x="572" y="58" class="status-win" style="font-size:16px;">LCM = 21</text>
  </g>

  <!-- Footer Summary -->
  <rect x="95" y="462" width="570" height="34" rx="6" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2" />
  <text x="380" y="479" style="font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1b5e20; text-anchor: middle; dominant-baseline: central;">
    Result: 21 is the smallest number divisible by both 3 and 7 with remainder 0.
  </text>
</svg>